# Self-host the CheckMyCode web scanner:  docker compose up -d  →  http://localhost:8080
services:
  checkmycode:
    build: .
    image: ghcr.io/aliuwahab/checkmycode:latest
    command: web
    ports:
      - "8080:8080"
    environment:
      CHECKMYCODE_WORKERS: 2               # concurrent scans
      CHECKMYCODE_WEB_SCANS_PER_HOUR: 10   # per IP
      CHECKMYCODE_WEB_RESULTS_TTL_MINUTES: 60
      CHECKMYCODE_WEB_MAX_UPLOAD_MB: 50
    volumes:
      # Trivy's vulnerability DB and endoflife.date lookups are cached here.
      # Uploaded code is deleted after each scan; nothing else persists.
      - checkmycode-data:/data
    restart: unless-stopped

volumes:
  checkmycode-data:
